name: HTML build (Windows and macOS)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install source dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint source
        run: npm run lint
      - name: Test plaintext disk storage and single-file packaging
        run: npm test
      - name: Build the app
        run: npm run build
